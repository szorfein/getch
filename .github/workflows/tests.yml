name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1
        with:
          ruby-version: '3.3'
      - name: Install test dependencies
        run: |
          gem install rake --no-document
          gem install minitest -v '~> 5.0' --no-document
      - name: Run tests
        run: rake test
